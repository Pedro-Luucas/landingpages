[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studio-pipeline"
version = "0.1.0"
description = "Collect, enrich, and generate landing-page data for music studios."
requires-python = ">=3.11"
dependencies = [
    "jsonschema[format-nongpl]>=4.21",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
studio-pipeline = "studio_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
studio_pipeline = ["ai/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
